# ==============================================================================
# SonarQube Scanner Configuration - My Academia Multi-Service Project
# ==============================================================================

# Project Identification
sonar.projectKey=my-academia
sonar.projectName=My Academia Platform
sonar.projectVersion=1.0.0

# Source Code & Test Directories
sonar.sources=backend,frontend/src,ai-service/app,api-gateway
sonar.tests=backend/tests,frontend/src

# File Encodings
sonar.sourceEncoding=UTF-8

# Language Inclusions
sonar.inclusions=**/*.js,**/*.jsx,**/*.py,**/*.ts,**/*.tsx,**/*.css,**/*.html

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/build/**,\
  **/dist/**,\
  **/.venv/**,\
  **/chroma_data/**,\
  **/coverage/**,\
  **/uploads/**,\
  **/*.test.js,\
  **/*.spec.js,\
  **/prisma/migrations/**

# Test Inclusions
sonar.test.inclusions=\
  **/*.test.js,\
  **/*.spec.js,\
  backend/tests/**/*.js

# Code Coverage Reports
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=ai-service/coverage.xml

# Quality Gate & Security Settings
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S1186
sonar.issue.ignore.multicriteria.e1.resourceKey=backend/tests/**/*
